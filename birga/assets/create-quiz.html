<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz yaratish — BIRGA</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .question-block { background: var(--surface-2); border-radius: 14px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); }
    .answer-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    .answer-row input[type="radio"] { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; }
    .answer-row .input { flex: 1; }
    .q-remove { color: var(--danger); background: transparent; border: none; font-size: 1.2rem; cursor: pointer; padding: 4px 8px; }
  </style>
</head>
<body>

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="images/logo.svg" alt="" style="width:34px;height:34px;border-radius:10px" />
      <span>BIRGA</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html"><span class="icon">🏠</span><span data-i18n="nav.dashboard">Boshqaruv</span></a>
      <a class="nav-item active" href="quiz.html"><span class="icon">🧠</span><span data-i18n="nav.quiz">Quizlar</span></a>
      <a class="nav-item" href="challenge.html"><span class="icon">🎯</span><span data-i18n="nav.challenge">Challenge</span></a>
      <a class="nav-item" href="battle.html"><span class="icon">⚔️</span><span data-i18n="nav.battle">Battle</span></a>
      <a class="nav-item" href="polls.html"><span class="icon">📊</span><span data-i18n="nav.polls">Ovoz berish</span></a>
      <a class="nav-item" href="stories.html"><span class="icon">✨</span><span data-i18n="nav.stories">Stories</span></a>
      <a class="nav-item" href="community.html"><span class="icon">👥</span><span data-i18n="nav.community">Hamjamiyat</span></a>
      <a class="nav-item" href="leaderboard.html"><span class="icon">🏆</span><span data-i18n="nav.leaderboard">Reyting</span></a>
      <a class="nav-item" href="profile.html"><span class="icon">👤</span><span data-i18n="nav.profile">Profil</span></a>
      <a class="nav-item" href="settings.html"><span class="icon">⚙️</span><span data-i18n="nav.settings">Sozlamalar</span></a>
    </nav>
    <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border)">
      <button class="nav-item w-full" data-logout><span class="icon">🚪</span><span data-i18n="nav.logout">Chiqish</span></button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title" data-i18n="quiz.create.title">Yangi quiz yaratish</h1>
      <a class="btn btn-ghost" href="quiz.html">← <span data-i18n="common.back">Orqaga</span></a>
    </div>

    <form id="quizForm" class="grid" style="gap:20px;max-width:900px">
      <div class="card">
        <div class="form-group mb-4">
          <label class="form-label" data-i18n="quiz.form.name">Quiz nomi</label>
          <input class="input" name="title" id="title" maxlength="100" />
        </div>
        <div class="form-group mb-4">
          <label class="form-label" data-i18n="quiz.form.desc">Tavsif</label>
          <textarea class="textarea" name="description" id="description" maxlength="300"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="quiz.form.time">Vaqt chegarasi (soniya)</label>
          <input class="input" name="timePerQ" id="timePerQ" type="number" min="5" max="120" value="20" />
        </div>
      </div>

      <div>
        <h3 class="mb-3" data-i18n="quiz.form.question">Savol</h3>
        <div id="questionsWrap"></div>
        <button type="button" class="btn btn-secondary w-full" id="addQuestion">➕ <span data-i18n="quiz.form.addq">Savol qo‘shish</span></button>
      </div>

      <div class="flex gap-3">
        <button type="submit" class="btn btn-primary btn-lg" id="publishBtn" data-i18n="quiz.form.publish">E’lon qilish</button>
        <a href="quiz.html" class="btn btn-secondary btn-lg" data-i18n="common.cancel">Bekor qilish</a>
      </div>
    </form>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
<script src="js/gamification.js"></script>
<script src="js/quiz.js"></script>
<script src="js/challenge.js"></script>
<script src="js/battle.js"></script>
<script src="js/polls.js"></script>
<script src="js/stories.js"></script>
<script src="js/community.js"></script>
<script src="js/profile.js"></script>
<script src="js/sharing.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!Auth.requireAuth('login.html')) return;

    const params = new URLSearchParams(location.search);
    const editId = params.get('id');
    const editing = editId ? Quiz.get(editId) : null;

    const wrap = document.getElementById('questionsWrap');
    let qIndex = 0;

    function addQuestionBlock(q = null) {
      qIndex++;
      const block = document.createElement('div');
      block.className = 'question-block';
      block.innerHTML = `
        <div class="flex justify-between items-center mb-2">
          <strong>Savol #${qIndex}</strong>
          <button type="button" class="q-remove">✕</button>
        </div>
        <input class="input mb-3" placeholder="${t('quiz.form.question')}" data-qtext maxlength="200" value="${q ? UI.escapeHtml(q.text) : ''}" />
        ${[0,1,2,3].map(i => `
          <div class="answer-row">
            <input type="radio" name="correct_${qIndex}" ${q && q.correct === i ? 'checked' : (i === 0 && !q ? '' : '')} data-correct="${i}" />
            <input class="input" placeholder="${t('quiz.form.answer')} ${i + 1}" data-answer="${i}" maxlength="120" value="${q ? UI.escapeHtml(q.answers[i] || '') : ''}" />
          </div>
        `).join('')}
      `;
      wrap.appendChild(block);
      block.querySelector('.q-remove').onclick = () => block.remove();
    }

    if (editing) {
      document.getElementById('title').value = editing.title;
      document.getElementById('description').value = editing.description || '';
      document.getElementById('timePerQ').value = editing.timePerQ || 20;
      editing.questions.forEach(q => addQuestionBlock(q));
    } else {
      addQuestionBlock();
    }

    document.getElementById('addQuestion').onclick = () => addQuestionBlock();

    document.getElementById('quizForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const timePerQ = Number(document.getElementById('timePerQ').value) || 20;

      if (!title) { UI.toast('Quiz nomi kiritilmadi', 'error'); return; }

      const questions = [];
      const blocks = wrap.querySelectorAll('.question-block');
      for (const b of blocks) {
        const text = b.querySelector('[data-qtext]').value.trim();
        const answers = [...b.querySelectorAll('[data-answer]')].map(i => i.value.trim());
        const correctRadio = b.querySelector('input[type="radio"]:checked');
        if (!text) { UI.toast('Savol bo‘sh', 'error'); return; }
        if (answers.some(a => !a)) { UI.toast('Barcha javoblarni to‘ldiring', 'error'); return; }
        if (!correctRadio) { UI.toast('To‘g‘ri javobni belgilang', 'error'); return; }
        questions.push({ text, answers, correct: Number(correctRadio.getAttribute('data-correct')) });
      }
      if (!questions.length) { UI.toast(t('quiz.form.minq'), 'error'); return; }

      if (editing) {
        Quiz.update(editing.id, { title, description, timePerQ, questions });
        UI.toast('Quiz yangilandi ✓', 'success');
      } else {
        Quiz.create({ title, description, timePerQ, questions });
        UI.toast('Quiz yaratildi! 🎉', 'success');
      }
      setTimeout(() => location.href = 'quiz.html', 700);
    });
  });
</script>
</body>
</html>
