<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kirish — BIRGA</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
    }
    .auth-visual {
      background: radial-gradient(circle at 30% 30%, rgba(121,87,255,.35), transparent 60%),
                  radial-gradient(circle at 80% 70%, rgba(34,211,238,.25), transparent 60%),
                  var(--surface);
      display: flex; flex-direction: column; justify-content: center;
      padding: 60px; border-right: 1px solid var(--border);
    }
    .auth-form-side { display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
    .auth-form-box { width: 100%; max-width: 420px; }
    @media (max-width: 900px) {
      .auth-wrap { grid-template-columns: 1fr; }
      .auth-visual { display: none; }
    }
  </style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual">
    <a href="index.html" class="flex items-center gap-2 mb-6">
      <img src="images/logo.svg" alt="BIRGA" style="width:42px;height:42px;border-radius:12px" />
      <span style="font-weight:800;font-size:1.5rem">BIRGA</span>
    </a>
    <h2 class="mb-4">Birga o‘yna, birga o‘rgan, birga g‘olib bo‘l!</h2>
    <p class="text-muted" style="max-width:420px">
      Quizlar, challenge, battle va hamjamiyat — O‘zbekistondagi eng qiziqarli ijtimoiy platforma.
    </p>
    <img src="images/illustrations/hero.svg" alt="" style="max-width:340px;margin-top:32px;opacity:.9" />
  </div>

  <div class="auth-form-side">
    <div class="auth-form-box">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h1 class="mb-2" data-i18n="auth.login.title">Xush kelibsiz!</h1>
          <p class="text-muted" data-i18n="auth.login.subtitle">Hisobingizga kiring</p>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-icon btn-ghost" data-theme-toggle>🌙</button>
          <button class="btn btn-ghost btn-sm" data-lang="uz">UZ</button>
          <button class="btn btn-ghost btn-sm" data-lang="ru">RU</button>
          <button class="btn btn-ghost btn-sm" data-lang="en">EN</button>
        </div>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group mb-4">
          <label class="form-label" for="email" data-i18n="auth.login.email">Email yoki username</label>
          <input class="input" id="email" name="email" type="text" autocomplete="username" />
        </div>
        <div class="form-group mb-6">
          <label class="form-label" for="password" data-i18n="auth.login.password">Parol</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" />
        </div>

        <button class="btn btn-primary w-full btn-lg mb-4" type="submit" data-i18n="auth.login.btn">Kirish</button>

        <div class="text-center text-muted mb-4">
          <span data-i18n="auth.login.noaccount">Hisobingiz yo‘qmi?</span>
          <a href="register.html" style="color:var(--secondary);font-weight:600" data-i18n="nav.register">Ro‘yxatdan o‘tish</a>
        </div>

        <div style="position:relative;text-align:center;margin:20px 0">
          <span class="text-muted" style="background:var(--bg);padding:0 12px;position:relative;z-index:1">— yoki —</span>
          <hr style="border:none;border-top:1px solid var(--border);position:absolute;top:50%;left:0;right:0;z-index:0" />
        </div>

        <button class="btn btn-secondary w-full" type="button" id="demoBtn" data-i18n="auth.demo">Demo sifatida kirish</button>
      </form>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
<script src="js/gamification.js"></script>
<script src="js/quiz.js"></script>
<script src="js/challenge.js"></script>
<script src="js/battle.js"></script>
<script src="js/polls.js"></script>
<script src="js/stories.js"></script>
<script src="js/community.js"></script>
<script src="js/profile.js"></script>
<script src="js/sharing.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // If already logged in, redirect
    if (Auth.isLoggedIn()) location.href = 'dashboard.html';

    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      Validation.clearAll(form);
      const email = form.email.value.trim();
      const password = form.password.value;
      const errors = Validation.validateLogin({ email, password });
      if (Object.keys(errors).length) {
        if (errors.email) Validation.showError(form.email, errors.email);
        if (errors.password) Validation.showError(form.password, errors.password);
        return;
      }
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      const res = await Auth.login({ email, password });
      btn.disabled = false;
      if (!res.ok) {
        UI.toast(res.error, 'error');
        Validation.showError(form.password, res.error);
        return;
      }
      UI.toast(t('auth.success.login'), 'success');
      setTimeout(() => location.href = 'dashboard.html', 500);
    });

    document.getElementById('demoBtn').addEventListener('click', () => {
      Auth.loginDemo();
      UI.toast(t('auth.success.login'), 'success');
      setTimeout(() => location.href = 'dashboard.html', 500);
    });
  });
</script>
</body>
</html>
