<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz o‘ynash — BIRGA</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .play-wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
    .question-title { font-size: 1.4rem; font-weight: 700; margin: 20px 0; }
    .answer-btn {
      display: block; width: 100%; text-align: left;
      padding: 16px 20px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px;
      margin-bottom: 12px; font-weight: 600; cursor: pointer;
      transition: all .2s;
    }
    .answer-btn:hover { background: var(--surface-2); transform: translateY(-1px); }
    .answer-btn.correct { background: rgba(16,185,129,.15); border-color: var(--success); }
    .answer-btn.wrong { background: rgba(239,68,68,.15); border-color: var(--danger); }
    .answer-btn:disabled { cursor: default; }
    .timer-ring {
      width: 64px; height: 64px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.2rem;
      background: conic-gradient(var(--primary) var(--p, 100%), var(--surface-2) 0);
      position: relative;
    }
    .timer-ring::before {
      content: ''; position: absolute; inset: 6px; border-radius: 50%; background: var(--bg);
    }
    .timer-ring span { position: relative; z-index: 1; }
  </style>
</head>
<body>

<div class="play-wrap">
  <div class="flex justify-between items-center mb-6">
    <a class="btn btn-ghost" href="quiz.html">← <span data-i18n="common.back">Orqaga</span></a>
    <div class="flex gap-2 items-center">
      <span class="badge badge-primary" id="scoreBadge">0</span>
      <div class="timer-ring" id="timerRing" style="--p:100%"><span id="timerText">--</span></div>
    </div>
  </div>

  <div id="playArea"></div>
</div>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
<script src="js/gamification.js"></script>
<script src="js/quiz.js"></script>
<script src="js/challenge.js"></script>
<script src="js/battle.js"></script>
<script src="js/polls.js"></script>
<script src="js/stories.js"></script>
<script src="js/community.js"></script>
<script src="js/profile.js"></script>
<script src="js/sharing.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const quiz = id ? Quiz.get(id) : null;

    const playArea = document.getElementById('playArea');

    if (!quiz) {
      playArea.innerHTML = `<div class="card text-center"><h3>Quiz topilmadi</h3><a class="btn btn-primary mt-4" href="quiz.html">Quizlar</a></div>`;
      return;
    }

    let current = 0;
    let score = 0;
    let answers = [];
    let timerHandle = null;
    let timeLeft = 0;
    const timePerQ = quiz.timePerQ || 20;
    const timerText = document.getElementById('timerText');
    const timerRing = document.getElementById('timerRing');
    const scoreBadge = document.getElementById('scoreBadge');

    function startQuestion() {
      clearInterval(timerHandle);
      const q = quiz.questions[current];
      timeLeft = timePerQ;
      playArea.innerHTML = `
        <div class="card">
          <div class="flex justify-between items-center mb-3">
            <span class="badge badge-primary">${current + 1} / ${quiz.questions.length}</span>
            <span class="text-muted" style="font-size:.9rem">${UI.escapeHtml(quiz.title)}</span>
          </div>
          <div class="progress mb-4"><div class="progress-bar" style="width:${(current/quiz.questions.length)*100}%"></div></div>
          <div class="question-title">${UI.escapeHtml(q.text)}</div>
          ${q.answers.map((a, i) => `<button class="answer-btn" data-i="${i}">${UI.escapeHtml(a)}</button>`).join('')}
        </div>
      `;

      playArea.querySelectorAll('.answer-btn').forEach(btn => {
        btn.onclick = () => pick(Number(btn.getAttribute('data-i')));
      });

      updateTimer();
      timerHandle = setInterval(() => {
        timeLeft--;
        updateTimer();
        if (timeLeft <= 0) {
          clearInterval(timerHandle);
          pick(-1);
        }
      }, 1000);
    }

    function updateTimer() {
      timerText.textContent = timeLeft;
      const pct = (timeLeft / timePerQ) * 100;
      timerRing.style.setProperty('--p', pct + '%');
      timerRing.style.background = `conic-gradient(${pct < 30 ? 'var(--danger)' : pct < 60 ? 'var(--warning)' : 'var(--primary)'} ${pct}%, var(--surface-2) 0)`;
    }

    function pick(i) {
      clearInterval(timerHandle);
      const q = quiz.questions[current];
      const correct = i === q.correct;
      if (correct) score++;
      answers.push({ picked: i, correct: q.correct, isCorrect: correct });
      scoreBadge.textContent = score;

      playArea.querySelectorAll('.answer-btn').forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.correct) btn.classList.add('correct');
        else if (idx === i) btn.classList.add('wrong');
      });

      setTimeout(() => {
        current++;
        if (current < quiz.questions.length) startQuestion();
        else finish();
      }, 800);
    }

    function finish() {
      Quiz.incrementPlays(quiz.id);
      const total = quiz.questions.length;
      const xp = CONFIG.XP.QUIZ_COMPLETE + (score === total ? CONFIG.XP.QUIZ_PERFECT : 0);
      Storage.set('last_result', {
        quizId: quiz.id,
        quizTitle: quiz.title,
        score, total, xp,
        answers,
      });
      Gamification.addXP(xp, 'Quiz yakunlandi');
      if (score === total) Gamification.awardBadge('perfect-quiz', 'Perfect Quiz');
      location.href = 'quiz-result.html';
    }

    startQuestion();
  });
</script>
</body>
</html>
