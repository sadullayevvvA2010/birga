<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ovoz berish — BIRGA</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .poll-option {
      display: block; width: 100%; position: relative;
      padding: 14px 18px; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 12px;
      margin-bottom: 10px; cursor: pointer; text-align: left;
      overflow: hidden; transition: all .2s;
    }
    .poll-option:hover { border-color: var(--primary); }
    .poll-option .fill {
      position: absolute; top: 0; left: 0; bottom: 0;
      background: rgba(121,87,255,.18); z-index: 0;
      transition: width .4s ease;
    }
    .poll-option .content {
      position: relative; z-index: 1;
      display: flex; justify-content: space-between;
    }
    .poll-option.mine { border-color: var(--primary); }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="images/logo.svg" alt="" style="width:34px;height:34px;border-radius:10px" />

    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html"><span class="icon">🏠</span><span data-i18n="nav.dashboard">Boshqaruv</span></a>
      <a class="nav-item" href="quiz.html"><span class="icon">🧠</span><span data-i18n="nav.quiz">Quizlar</span></a>
      <a class="nav-item" href="challenge.html"><span class="icon">🎯</span><span data-i18n="nav.challenge">Challenge</span></a>
      <a class="nav-item" href="battle.html"><span class="icon">⚔️</span><span data-i18n="nav.battle">Battle</span></a>
      <a class="nav-item active" href="polls.html"><span class="icon">📊</span><span data-i18n="nav.polls">Ovoz berish</span></a>
      <a class="nav-item" href="stories.html"><span class="icon">✨</span><span data-i18n="nav.stories">Stories</span></a>
      <a class="nav-item" href="community.html"><span class="icon">👥</span><span data-i18n="nav.community">Hamjamiyat</span></a>
      <a class="nav-item" href="leaderboard.html"><span class="icon">🏆</span><span data-i18n="nav.leaderboard">Reyting</span></a>
      <a class="nav-item" href="profile.html"><span class="icon">👤</span><span data-i18n="nav.profile">Profil</span></a>
      <a class="nav-item" href="notifications.html"><span class="icon">🔔</span><span data-i18n="nav.notifications">Bildirishnomalar</span></a>
      <a class="nav-item" href="settings.html"><span class="icon">⚙️</span><span data-i18n="nav.settings">Sozlamalar</span></a>
      <a class="nav-item" href="help.html"><span class="icon">❓</span><span data-i18n="nav.help">Yordam</span></a>
    </nav>
    <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border)">
      <button class="nav-item w-full" data-logout><span class="icon">🚪</span><span data-i18n="nav.logout">Chiqish</span></button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title" data-i18n="polls.title">Ovoz berish</h1>
      <button class="btn btn-primary" id="createPollBtn">➕ <span data-i18n="polls.create">So‘rovnoma yaratish</span></button>
    </div>
    <div id="pollList" class="grid" style="gap:20px"></div>
  </main>
</div>

<nav class="bottom-nav">
  <ul>
    <li><a href="dashboard.html"><span class="icon">🏠</span><span data-i18n="nav.home">Bosh</span></a></li>
    <li><a href="quiz.html"><span class="icon">🧠</span><span data-i18n="nav.quiz">Quiz</span></a></li>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
<script src="js/gamification.js"></script>
<script src="js/quiz.js"></script>
<script src="js/challenge.js"></script>
<script src="js/battle.js"></script>
<script src="js/polls.js"></script>
<script src="js/stories.js"></script>
<script src="js/community.js"></script>
<script src="js/profile.js"></script>
<script src="js/sharing.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!Auth.requireAuth('login.html')) return;

    function render() {
      const list = Polls.all();
      const el = document.getElementById('pollList');
      if (!el) return;
      if (!list.length) {
        el.innerHTML = `<div class="card text-center" style="padding:40px">
          <p class="text-muted">${t('common.empty')}</p>
        </div>`;
        return;
      }
      el.innerHTML = list.map(p => {
        const total = p.options.reduce((s, o) => s + o.votes, 0);
        const voted = Polls.hasVoted(p.id);
        const myOpt = Polls.myVote(p.id);
        return `
          <div class="card">
            <h4 class="mb-2">${UI.escapeHtml(p.question)}</h4>
            <p class="text-muted mb-3" style="font-size:.85rem">
              @${UI.escapeHtml(p.authorName)} · ${total} ${t('polls.votes')}
            </p>
            <div>
              ${p.options.map(o => {
                const pct = total ? Math.round((o.votes / total) * 100) : 0;
                const isMine = myOpt === o.id;
                return `
                  <button class="poll-option ${isMine ? 'mine' : ''}" data-poll="${p.id}" data-opt="${o.id}" ${voted ? 'disabled' : ''}>
                    <div class="fill" style="width:${pct}%"></div>
                    <div class="content">
                      <span>${isMine ? '✓ ' : ''}${UI.escapeHtml(o.text)}</span>
                      <strong>${voted ? pct + '%' : ''}</strong>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
            ${voted ? `<span class="badge badge-success mt-2">${t('polls.voted')}</span>` : ''}
          </div>
        `;
      }).join('');

      el.querySelectorAll('.poll-option:not([disabled])').forEach(btn => {
        btn.onclick = () => {
          const pid = btn.getAttribute('data-poll');
          const oid = btn.getAttribute('data-opt');

          if (!pid || !oid) {
            UI.toast('Ovoz berish ma’lumotlari to‘liq emas.', 'error');
            return;
          }

          const res = Polls.vote(pid, oid);
          if (res.ok) {
            UI.toast('Ovoz berildi! ✓', 'success');
            render();
            return;
          }

          if (res.reason === 'already_voted') {
            UI.toast('Siz allaqachon ovoz bergansiz.', 'info');
            return;
          }

          UI.toast('Ovoz berishda xatolik yuz berdi.', 'error');
        };
      });
    }

    document.getElementById('createPollBtn').onclick = () => {
      UI.modal(t('polls.create'), `
        <div class="form-group mb-3">
          <label class="form-label">${t('polls.question')}</label>
          <input class="input" id="pq" maxlength="200" />
        </div>
        <div id="pollOpts">
          <div class="form-group mb-2"><input class="input" placeholder="${t('polls.options')} 1" /></div>
          <div class="form-group mb-2"><input class="input" placeholder="${t('polls.options')} 2" /></div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm mb-3" id="addOpt">➕ ${t('polls.addopt')}</button>
      `, (overlay) => {
        const q = overlay.querySelector('#pq').value.trim();
        const opts = [...overlay.querySelectorAll('#pollOpts input')].map(i => i.value.trim()).filter(Boolean);
        if (!q) { UI.toast('Savol bo‘sh', 'error'); return; }
        if (opts.length < 2) { UI.toast('Kamida 2 ta variant', 'error'); return; }
        Polls.create({ question: q, options: opts });
        overlay.remove();
        UI.toast('So‘rovnoma yaratildi!', 'success');
        render();
      }, t('common.create')).addEventListener('click', (e) => {
        const addBtn = e.target.closest('#addOpt');
        if (addBtn) {
          const overlay = addBtn.closest('.modal-overlay');
          const wrap = overlay.querySelector('#pollOpts');
          const idx = wrap.children.length + 1;
          const div = document.createElement('div');
          div.className = 'form-group mb-2';
          div.innerHTML = `<input class="input" placeholder="${t('polls.options')} ${idx}" />`;
          wrap.appendChild(div);
        }
      });
    };

    render();
  });
</script>
</body>
</html>
