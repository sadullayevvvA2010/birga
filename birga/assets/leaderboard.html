<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reyting — BIRGA</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .podium {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 16px; align-items: end; margin-bottom: 32px;
    }
    .podium-item { text-align: center; padding: 20px; background: var(--surface); border-radius: 18px; border: 1px solid var(--border); }
    .podium-item.first { transform: translateY(-20px); background: linear-gradient(160deg, rgba(121,87,255,.2), var(--surface)); border-color: var(--primary); }
    .podium-item .crown { font-size: 2rem; margin-bottom: 8px; }
    .podium-item .avatar { margin: 0 auto 8px; }
    .lb-row {
      display: grid; grid-template-columns: 50px 1fr auto;
      gap: 16px; align-items: center; padding: 14px 20px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; margin-bottom: 8px;
    }
    .lb-row.you { border-color: var(--primary); background: linear-gradient(90deg, rgba(121,87,255,.15), var(--surface)); }
    .lb-rank { font-weight: 800; font-size: 1.2rem; color: var(--text-muted); }
    .lb-rank.top { color: var(--primary); }
    @media (max-width: 600px) {
      .podium { grid-template-columns: 1fr; }
      .podium-item.first { transform: none; }
    }
  </style>
</head>
<body>

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="images/logo.svg" alt="" style="width:34px;height:34px;border-radius:10px" />
      <span>BIRGA</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html"><span class="icon">🏠</span><span data-i18n="nav.dashboard">Boshqaruv</span></a>
      <a class="nav-item" href="quiz.html"><span class="icon">🧠</span><span data-i18n="nav.quiz">Quizlar</span></a>
      <a class="nav-item" href="challenge.html"><span class="icon">🎯</span><span data-i18n="nav.challenge">Challenge</span></a>
      <a class="nav-item" href="battle.html"><span class="icon">⚔️</span><span data-i18n="nav.battle">Battle</span></a>
      <a class="nav-item" href="polls.html"><span class="icon">📊</span><span data-i18n="nav.polls">Ovoz berish</span></a>
      <a class="nav-item" href="stories.html"><span class="icon">✨</span><span data-i18n="nav.stories">Stories</span></a>
      <a class="nav-item" href="community.html"><span class="icon">👥</span><span data-i18n="nav.community">Hamjamiyat</span></a>
      <a class="nav-item active" href="leaderboard.html"><span class="icon">🏆</span><span data-i18n="nav.leaderboard">Reyting</span></a>
      <a class="nav-item" href="profile.html"><span class="icon">👤</span><span data-i18n="nav.profile">Profil</span></a>
      <a class="nav-item" href="notifications.html"><span class="icon">🔔</span><span data-i18n="nav.notifications">Bildirishnomalar</span></a>
      <a class="nav-item" href="settings.html"><span class="icon">⚙️</span><span data-i18n="nav.settings">Sozlamalar</span></a>
      <a class="nav-item" href="help.html"><span class="icon">❓</span><span data-i18n="nav.help">Yordam</span></a>
    </nav>
    <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border)">
      <button class="nav-item w-full" data-logout><span class="icon">🚪</span><span data-i18n="nav.logout">Chiqish</span></button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title" data-i18n="lb.title">Reyting</h1>
      <div class="tabs">
        <button class="tab active" data-period="all" data-i18n="lb.all">Umumiy</button>
        <button class="tab" data-period="weekly" data-i18n="lb.weekly">Haftalik</button>
      </div>
    </div>

    <div id="podium" class="podium"></div>
    <div id="leaderboardList"></div>
  </main>
</div>

<nav class="bottom-nav">
  <ul>
    <li><a href="dashboard.html"><span class="icon">🏠</span><span data-i18n="nav.home">Bosh</span></a></li>
    <li><a href="quiz.html"><span class="icon">🧠</span><span data-i18n="nav.quiz">Quiz</span></a></li>
    <li><a class="active" href="leaderboard.html"><span class="icon">🏆</span><span data-i18n="nav.leaderboard">Reyting</span></a></li>
    <li><a href="community.html"><span class="icon">👥</span><span data-i18n="nav.community">Hamjamiyat</span></a></li>
    <li><a href="profile.html"><span class="icon">👤</span><span data-i18n="nav.profile">Profil</span></a></li>
  </ul>
</nav>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
<script src="js/gamification.js"></script>
<script src="js/quiz.js"></script>
<script src="js/challenge.js"></script>
<script src="js/battle.js"></script>
<script src="js/polls.js"></script>
<script src="js/stories.js"></script>
<script src="js/community.js"></script>
<script src="js/profile.js"></script>
<script src="js/sharing.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!Auth.requireAuth('login.html')) return;
    const user = Auth.getCurrent();
    let period = 'all';

    function render() {
      const list = Gamification.leaderboard(period).slice(0, 20);
      const podium = document.getElementById('podium');
      const lbList = document.getElementById('leaderboardList');

      const top3 = list.slice(0, 3);
      const order = [top3[1], top3[0], top3[2]].filter(Boolean);
      podium.innerHTML = order.map((u, i) => {
        const place = u === top3[0] ? 1 : u === top3[1] ? 2 : 3;
        const isFirst = place === 1;
        return `
          <div class="podium-item ${isFirst ? 'first' : ''}">
            <div class="crown">${place === 1 ? '👑' : place === 2 ? '🥈' : '🥉'}</div>
            <img class="avatar avatar-lg" src="${UI.escapeHtml(u.avatar || 'images/avatars/default.svg')}" alt="" />
            <div style="font-weight:700;margin-top:8px">${UI.escapeHtml(u.name || u.username)}</div>
            <div class="text-muted" style="font-size:.85rem">@${UI.escapeHtml(u.username)}</div>
            <div class="text-gradient" style="font-weight:800;font-size:1.2rem;margin-top:6px">${u.xp || 0} XP</div>
          </div>
        `;
      }).join('');

      lbList.innerHTML = list.map((u, i) => {
        const isYou = u.id === user.id;
        return `
          <div class="lb-row ${isYou ? 'you' : ''}">
            <div class="lb-rank ${i < 3 ? 'top' : ''}">#${i + 1}</div>
            <div class="flex items-center gap-3">
              <img class="avatar avatar-sm" src="${UI.escapeHtml(u.avatar || 'images/avatars/default.svg')}" alt="" />
              <div>
                <div style="font-weight:700">${UI.escapeHtml(u.name || u.username)} ${isYou ? '· (Siz)' : ''}</div>
                <div class="text-muted" style="font-size:.82rem">@${UI.escapeHtml(u.username)} · Lv ${u.level || 1}</div>
              </div>
            </div>
            <div class="text-gradient" style="font-weight:800">${u.xp || 0} XP</div>
          </div>
        `;
      }).join('');
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        tab.classList.add('active');
        period = tab.getAttribute('data-period');
        render();
      };
    });

    render();
  });
</script>
</body>
</html>
