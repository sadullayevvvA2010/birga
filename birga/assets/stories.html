  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .story-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 20px; margin-bottom: 16px;
    }
    .story-img {
      width: 100%; max-height: 400px; object-fit: cover;
      border-radius: 14px; margin-top: 12px;
    }
    .react-btn {
      padding: 6px 12px; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 999px;
      cursor: pointer; transition: all .2s; font-size: .9rem;
    }
    .react-btn:hover { background: var(--primary); border-color: var(--primary); }
  </style>
</head>
<body>

    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html"><span class="icon">🏠</span><span data-i18n="nav.dashboard">Boshqaruv</span></a>
      <a class="nav-item" href="quiz.html"><span class="icon">🧠</span><span data-i18n="nav.quiz">Quizlar</span></a>
      <a class="nav-item" href="challenge.html"><span class="icon">🎯</span><span data-i18n="nav.challenge">Challenge</span></a>
      <a class="nav-item" href="battle.html"><span class="icon">⚔️</span><span data-i18n="nav.battle">Battle</span></a>
      <a class="nav-item" href="polls.html"><span class="icon">📊</span><span data-i18n="nav.polls">Ovoz berish</span></a>
      <a class="nav-item active" href="stories.html"><span class="icon">✨</span><span data-i18n="nav.stories">Stories</span></a>
      <a class="nav-item" href="community.html"><span class="icon">👥</span><span data-i18n="nav.community">Hamjamiyat</span></a>
      <a class="nav-item" href="leaderboard.html"><span class="icon">🏆</span><span data-i18n="nav.leaderboard">Reyting</span></a>
      <a class="nav-item" href="profile.html"><span class="icon">👤</span><span data-i18n="nav.profile">Profil</span></a>
      <a class="nav-item" href="notifications.html"><span class="icon">🔔</span><span data-i18n="nav.notifications">Bildirishnomalar</span></a>

      <button class="nav-item w-full" data-logout><span class="icon">🚪</span><span data-i18n="nav.logout">Chiqish</span></button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title" data-i18n="stories.title">Stories</h1>
      <button class="btn btn-primary" id="createStoryBtn">➕ <span data-i18n="stories.create">Story qo‘shish</span></button>
    </div>
    <div id="storiesList" style="max-width:720px"></div>
  </main>
</div>

<nav class="bottom-nav">
  <ul>
    <li><a href="dashboard.html"><span class="icon">🏠</span><span data-i18n="nav.home">Bosh</span></a></li>
    <li><a href="community.html"><span class="icon">👥</span><span data-i18n="nav.community">Hamjamiyat</span></a></li>
    <li><a class="active" href="stories.html"><span class="icon">✨</span><span data-i18n="nav.stories">Stories</span></a></li>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
<script src="js/gamification.js"></script>
<script src="js/quiz.js"></script>
<script src="js/challenge.js"></script>
<script src="js/battle.js"></script>
<script src="js/polls.js"></script>
<script src="js/stories.js"></script>
<script src="js/community.js"></script>
<script src="js/profile.js"></script>
<script src="js/sharing.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!Auth.requireAuth('login.html')) return;

    function render() {
      const list = Stories.sortedByTime();
      const el = document.getElementById('storiesList');
      if (!list.length) {
        el.innerHTML = `<div class="card text-center" style="padding:40px">
          <p class="text-muted">${t('common.empty')}</p>
        </div>`;
        return;
      }
      el.innerHTML = list.map(s => {
        const reactionsTotal = Object.values(s.reactions || {}).reduce((a, b) => a + b, 0);
        return `
          <div class="story-card">
            <div class="flex items-center gap-3 mb-2">
              <img src="${UI.escapeHtml(s.avatar || 'images/avatars/default.svg')}" alt="" class="avatar avatar-sm" />
              <div>
                <div style="font-weight:700">${UI.escapeHtml(s.authorName)}</div>
                <div class="text-muted" style="font-size:.8rem">@${UI.escapeHtml(s.authorUsername)} · ${UI.timeAgo(s.createdAt)}</div>
              </div>
              <div class="text-muted" style="margin-left:auto;font-size:.85rem">👁 ${s.views}</div>
            </div>
            <p style="white-space:pre-wrap">${UI.escapeHtml(s.text)}</p>
            ${s.imageUrl ? `<img class="story-img" src="${UI.escapeHtml(s.imageUrl)}" onerror="this.style.display='none'" alt="" />` : ''}
            <div class="flex gap-2 mt-4" style="flex-wrap:wrap">
              ${['❤️', '🔥', '😮', '😂'].map(e => `
                <button class="react-btn" data-react="${e}" data-sid="${s.id}">${e} ${s.reactions[e] || 0}</button>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');

      el.querySelectorAll('[data-react]').forEach(b => {
        b.onclick = () => {
          Stories.react(b.getAttribute('data-sid'), b.getAttribute('data-react'));
          render();
        };
      });
      // Mark views for all visible stories (once)
      list.forEach(s => Stories.view(s.id));
    }

    document.getElementById('createStoryBtn').onclick = () => {
      UI.modal(t('stories.create'), `
        <div class="form-group mb-3">
          <label class="form-label">${t('stories.text')}</label>
          <textarea class="textarea" id="stext" maxlength="500" placeholder="Bugun nima qildingiz?"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">${t('stories.image')}</label>
          <input class="input" id="simg" placeholder="https://..." />
        </div>
      `, (overlay) => {
        const text = overlay.querySelector('#stext').value.trim();
        const img = overlay.querySelector('#simg').value.trim();
        if (!text) { UI.toast('Matn bo‘sh', 'error'); return; }
        Stories.create({ text, imageUrl: img });
        overlay.remove();
        UI.toast('Story qo‘shildi! ✨', 'success');
        render();
      }, t('common.create'));
    };

    render();
  });
</script>
</body>
</html>
