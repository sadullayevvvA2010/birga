<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quizlar — BIRGA</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="images/logo.svg" alt="" style="width:34px;height:34px;border-radius:10px" />
      <span>BIRGA</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html"><span class="icon">🏠</span><span data-i18n="nav.dashboard">Boshqaruv</span></a>
      <a class="nav-item active" href="quiz.html"><span class="icon">🧠</span><span data-i18n="nav.quiz">Quizlar</span></a>
      <a class="nav-item" href="challenge.html"><span class="icon">🎯</span><span data-i18n="nav.challenge">Challenge</span></a>
      <a class="nav-item" href="battle.html"><span class="icon">⚔️</span><span data-i18n="nav.battle">Battle</span></a>
      <a class="nav-item" href="polls.html"><span class="icon">📊</span><span data-i18n="nav.polls">Ovoz berish</span></a>
      <a class="nav-item" href="stories.html"><span class="icon">✨</span><span data-i18n="nav.stories">Stories</span></a>
      <a class="nav-item" href="community.html"><span class="icon">👥</span><span data-i18n="nav.community">Hamjamiyat</span></a>
      <a class="nav-item" href="leaderboard.html"><span class="icon">🏆</span><span data-i18n="nav.leaderboard">Reyting</span></a>
      <a class="nav-item" href="profile.html"><span class="icon">👤</span><span data-i18n="nav.profile">Profil</span></a>
      <a class="nav-item" href="notifications.html"><span class="icon">🔔</span><span data-i18n="nav.notifications">Bildirishnomalar</span></a>
      <a class="nav-item" href="settings.html"><span class="icon">⚙️</span><span data-i18n="nav.settings">Sozlamalar</span></a>
      <a class="nav-item" href="help.html"><span class="icon">❓</span><span data-i18n="nav.help">Yordam</span></a>
    </nav>
    <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border)">
      <button class="nav-item w-full" data-logout><span class="icon">🚪</span><span data-i18n="nav.logout">Chiqish</span></button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title" data-i18n="quiz.title">Quizlar</h1>
      <div class="flex gap-2">
        <input class="input" id="quizSearch" style="max-width:260px" data-i18n-placeholder="common.search" placeholder="Qidirish..." />
        <a class="btn btn-primary" href="create-quiz.html">➕ <span data-i18n="quiz.create">Quiz yaratish</span></a>
      </div>
    </div>

    <div class="tabs mb-6">
      <button class="tab active" data-filter="all" data-i18n="common.all">Barchasi</button>
      <button class="tab" data-filter="mine">Mening quizlarim</button>
      <button class="tab" data-filter="popular">Ommabop</button>
    </div>

    <div id="quizGrid" class="grid grid-3"></div>
  </main>
</div>

<nav class="bottom-nav">
  <ul>
    <li><a href="dashboard.html"><span class="icon">🏠</span><span data-i18n="nav.home">Bosh</span></a></li>
    <li><a class="active" href="quiz.html"><span class="icon">🧠</span><span data-i18n="nav.quiz">Quiz</span></a></li>
    <li><a href="battle.html"><span class="icon">⚔️</span><span data-i18n="nav.battle">Battle</span></a></li>
    <li><a href="leaderboard.html"><span class="icon">🏆</span><span data-i18n="nav.leaderboard">Reyting</span></a></li>
    <li><a href="profile.html"><span class="icon">👤</span><span data-i18n="nav.profile">Profil</span></a></li>
  </ul>
</nav>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
<script src="js/gamification.js"></script>
<script src="js/quiz.js"></script>
<script src="js/challenge.js"></script>
<script src="js/battle.js"></script>
<script src="js/polls.js"></script>
<script src="js/stories.js"></script>
<script src="js/community.js"></script>
<script src="js/profile.js"></script>
<script src="js/sharing.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!Auth.requireAuth('login.html')) return;
    const user = Auth.getCurrent();

    let filter = 'all';
    let query = '';

    function render() {
      let list = Quiz.all();
      if (filter === 'mine') list = list.filter(q => q.authorId === user.id);
      if (filter === 'popular') list = [...list].sort((a, b) => (b.plays || 0) - (a.plays || 0));
      if (query) {
        const q = query.toLowerCase();
        list = list.filter(x => x.title.toLowerCase().includes(q));
      }
      const el = document.getElementById('quizGrid');
      if (!list.length) {
        el.innerHTML = `<div class="card text-center" style="grid-column:1/-1;padding:40px">
          <img src="images/illustrations/empty.svg" alt="" style="width:120px;margin:0 auto 16px" />
          <h4>${t('quiz.empty.title')}</h4>
          <p class="text-muted">${t('quiz.empty.desc')}</p>
          <a class="btn btn-primary mt-4" href="create-quiz.html">${t('quiz.create')}</a>
        </div>`;
        return;
      }
      el.innerHTML = list.map(q => {
        const mine = q.authorId === user.id;
        return `
        <div class="card">
          <div class="flex justify-between items-start gap-2 mb-2">
            <span class="badge badge-primary">${q.questions.length} ${t('quiz.questions')}</span>
            ${mine ? `<span class="badge badge-accent">Mening</span>` : ''}
          </div>
          <h4 class="mb-2">${UI.escapeHtml(q.title)}</h4>
          <p class="text-muted" style="font-size:.88rem;min-height:38px">${UI.escapeHtml(q.description || '')}</p>
          <p class="text-muted mt-2" style="font-size:.78rem">${t('quiz.by')} @${UI.escapeHtml(q.authorUsername || 'anon')} · ${q.plays || 0} ${t('quiz.taken')}</p>
          <div class="flex gap-2 mt-4">
            <a class="btn btn-primary btn-sm" href="quiz-play.html?id=${encodeURIComponent(q.id)}">${t('quiz.play')}</a>
            ${mine ? `
              <a class="btn btn-secondary btn-sm" href="create-quiz.html?id=${encodeURIComponent(q.id)}">${t('quiz.edit')}</a>
              <button class="btn btn-ghost btn-sm" data-del="${encodeURIComponent(q.id)}" style="color:var(--danger)">🗑</button>
            ` : ''}
            <button class="btn btn-ghost btn-sm" data-share="${encodeURIComponent(q.id)}">🔗</button>
          </div>
        </div>
      `}).join('');

      el.querySelectorAll('[data-del]').forEach(b => {
        b.onclick = () => {
          const id = b.getAttribute('data-del');
          UI.modal(t('common.delete') + '?', `<p>${t('common.confirm')}?</p>`, (overlay) => {
            Quiz.remove(id);
            overlay.remove();
            UI.toast(t('common.delete') + ' ✓', 'success');
            render();
          }, t('common.delete'));
        };
      });

      el.querySelectorAll('[data-share]').forEach(b => {
        b.onclick = () => {
          const id = b.getAttribute('data-share');
          const q = Quiz.get(id);
          if (!q) return;
          const url = Sharing.quizLink(id);
          UI.modal(t('common.share'), `
            <div class="grid gap-2">
              <button class="btn btn-secondary" data-act="copy">📋 ${t('common.copy')}</button>
              <button class="btn btn-secondary" data-act="tg">✈️ Telegram</button>
              <button class="btn btn-secondary" data-act="wa">💬 WhatsApp</button>
              <button class="btn btn-secondary" data-act="native">📤 Web Share</button>
            </div>
          `, null).addEventListener('click', async (e) => {
            const act = e.target.closest('[data-act]')?.getAttribute('data-act');
            if (!act) return;
            if (act === 'copy') await Sharing.copy(url);
            if (act === 'tg') Sharing.telegram(`"${q.title}" — BIRGA`, url);
            if (act === 'wa') Sharing.whatsapp(`"${q.title}" — BIRGA`, url);
            if (act === 'native') {
              const ok = await Sharing.webShare({ title: q.title, text: 'BIRGA quiz', url });
              if (!ok) Sharing.copy(url);
            }
          });
        };
      });
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        tab.classList.add('active');
        filter = tab.getAttribute('data-filter');
        render();
      };
    });

    document.getElementById('quizSearch').addEventListener('input', (e) => {
      query = e.target.value.trim();
      render();
    });

    render();
  });
</script>
</body>
</html>
