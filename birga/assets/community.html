<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hamjamiyat — BIRGA</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .post-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 20px; margin-bottom: 16px; }
    .comment { background: var(--surface-2); border-radius: 12px; padding: 12px; margin-top: 8px; }
    .post-actions { display: flex; gap: 8px; margin-top: 12px; }
    .post-action {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 10px;
      background: transparent; border: 1px solid var(--border);
      cursor: pointer; font-size: .9rem; color: var(--text-muted);
      transition: all .2s;
    }
    .post-action:hover { background: var(--surface-2); color: var(--text); }
    .post-action.liked { color: var(--danger); border-color: var(--danger); }
    .community-chip {
      padding: 8px 16px; border-radius: 999px; background: var(--surface-2);
      border: 1px solid var(--border); cursor: pointer; font-size: .9rem;
      font-weight: 600; white-space: nowrap; transition: all .2s;
    }
    .community-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  </style>
</head>
<body>

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="images/logo.svg" alt="" style="width:34px;height:34px;border-radius:10px" />
      <span>BIRGA</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html"><span class="icon">🏠</span><span data-i18n="nav.dashboard">Boshqaruv</span></a>
      <a class="nav-item" href="quiz.html"><span class="icon">🧠</span><span data-i18n="nav.quiz">Quizlar</span></a>
      <a class="nav-item" href="challenge.html"><span class="icon">🎯</span><span data-i18n="nav.challenge">Challenge</span></a>
      <a class="nav-item" href="battle.html"><span class="icon">⚔️</span><span data-i18n="nav.battle">Battle</span></a>
      <a class="nav-item" href="polls.html"><span class="icon">📊</span><span data-i18n="nav.polls">Ovoz berish</span></a>
      <a class="nav-item" href="stories.html"><span class="icon">✨</span><span data-i18n="nav.stories">Stories</span></a>
      <a class="nav-item active" href="community.html"><span class="icon">👥</span><span data-i18n="nav.community">Hamjamiyat</span></a>
      <a class="nav-item" href="leaderboard.html"><span class="icon">🏆</span><span data-i18n="nav.leaderboard">Reyting</span></a>
      <a class="nav-item" href="profile.html"><span class="icon">👤</span><span data-i18n="nav.profile">Profil</span></a>
      <a class="nav-item" href="notifications.html"><span class="icon">🔔</span><span data-i18n="nav.notifications">Bildirishnomalar</span></a>
      <a class="nav-item" href="settings.html"><span class="icon">⚙️</span><span data-i18n="nav.settings">Sozlamalar</span></a>
      <a class="nav-item" href="help.html"><span class="icon">❓</span><span data-i18n="nav.help">Yordam</span></a>
    </nav>
    <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border)">
      <button class="nav-item w-full" data-logout><span class="icon">🚪</span><span data-i18n="nav.logout">Chiqish</span></button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title" data-i18n="community.title">Hamjamiyat</h1>
      <div class="flex gap-2">
        <select class="select" id="sortSelect" style="max-width:160px">
          <option value="new" data-i18n="community.sort.new">Yangi</option>
          <option value="popular" data-i18n="community.sort.popular">Ommabop</option>
        </select>
        <button class="btn btn-secondary btn-sm" id="createCommunityBtn">➕ Guruh</button>
      </div>
    </div>

    <div class="flex gap-2 mb-6" id="communityChips" style="overflow-x:auto;padding-bottom:6px"></div>

    <div class="card mb-6" id="newPostCard">
      <textarea class="textarea" id="postText" placeholder="Nima haqida o'ylayapsiz?" maxlength="1000"></textarea>
      <div class="flex justify-end mt-3">
        <button class="btn btn-primary" id="postBtn">✍️ <span data-i18n="community.post">Post yozish</span></button>
      </div>
    </div>

    <div id="postsList"></div>
  </main>
</div>

<nav class="bottom-nav">
  <ul>
    <li><a href="dashboard.html"><span class="icon">🏠</span><span data-i18n="nav.home">Bosh</span></a></li>
    <li><a class="active" href="community.html"><span class="icon">👥</span><span data-i18n="nav.community">Hamjamiyat</span></a></li>
    <li><a href="stories.html"><span class="icon">✨</span><span data-i18n="nav.stories">Stories</span></a></li>
    <li><a href="leaderboard.html"><span class="icon">🏆</span><span data-i18n="nav.leaderboard">Reyting</span></a></li>
    <li><a href="profile.html"><span class="icon">👤</span><span data-i18n="nav.profile">Profil</span></a></li>
  </ul>
</nav>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
<script src="js/gamification.js"></script>
<script src="js/quiz.js"></script>
<script src="js/challenge.js"></script>
<script src="js/battle.js"></script>
<script src="js/polls.js"></script>
<script src="js/stories.js"></script>
<script src="js/community.js"></script>
<script src="js/profile.js"></script>
<script src="js/sharing.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!Auth.requireAuth('login.html')) return;
    const user = Auth.getCurrent();
    let sortMode = 'new';
    let activeCommunity = null;

    function renderChips() {
      const el = document.getElementById('communityChips');
      const comms = Community.allCommunities();
      el.innerHTML = `
        <button class="community-chip active" data-com="">🌍 ${t('common.all')}</button>
        ${comms.map(c => `<button class="community-chip" data-com="${c.id}">${UI.escapeHtml(c.name)} <span style="opacity:.6">(${c.members.length})</span></button>`).join('')}
      `;
      el.querySelectorAll('.community-chip').forEach(chip => {
        chip.onclick = () => {
          el.querySelectorAll('.community-chip').forEach(x => x.classList.remove('active'));
          chip.classList.add('active');
          activeCommunity = chip.getAttribute('data-com') || null;
          renderPosts();
        };
      });
    }

    function renderPosts() {
      let list = Community.sortedPosts(sortMode);
      if (activeCommunity) list = list.filter(p => p.communityId === activeCommunity);

      const el = document.getElementById('postsList');
      if (!list.length) {
        el.innerHTML = `<div class="card text-center" style="padding:40px">
          <p class="text-muted">${t('community.no_posts')}</p>
        </div>`;
        return;
      }
      el.innerHTML = list.map(p => {
        const liked = (p.likes || []).includes(user.id);
        return `
          <div class="post-card">
            <div class="flex items-center gap-3 mb-2">
              <img src="${UI.escapeHtml(p.avatar || 'images/avatars/default.svg')}" alt="" class="avatar avatar-sm" />
              <div>
                <div style="font-weight:700">${UI.escapeHtml(p.authorName)}</div>
                <div class="text-muted" style="font-size:.8rem">@${UI.escapeHtml(p.authorUsername)} · ${UI.timeAgo(p.createdAt)}</div>
              </div>
            </div>
            <p style="white-space:pre-wrap;margin-top:8px">${UI.escapeHtml(p.text)}</p>
            <div class="post-actions">
              <button class="post-action ${liked ? 'liked' : ''}" data-like="${p.id}">❤️ <span>${(p.likes || []).length}</span></button>
              <button class="post-action" data-comment="${p.id}">💬 <span>${(p.comments || []).length}</span></button>
            </div>
            <div id="comments-${p.id}">
              ${(p.comments || []).map(c => `
                <div class="comment flex items-center gap-2">
                  <img src="${UI.escapeHtml(c.avatar || 'images/avatars/default.svg')}" alt="" class="avatar avatar-sm" style="width:26px;height:26px" />
                  <div>
                    <div style="font-weight:600;font-size:.9rem">${UI.escapeHtml(c.authorName)}</div>
                    <div style="font-size:.9rem">${UI.escapeHtml(c.text)}</div>
                  </div>
                </div>
              `).join('')}
              <div class="flex gap-2 mt-2" id="commentForm-${p.id}" style="display:none">
                <input class="input" placeholder="${t('community.comment')}..." data-comment-input="${p.id}" style="flex:1;padding:8px 12px;font-size:.9rem" />
                <button class="btn btn-primary btn-sm" data-comment-submit="${p.id}">${t('common.submit')}</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      el.querySelectorAll('[data-like]').forEach(b => {
        b.onclick = () => {
          Community.like(b.getAttribute('data-like'));
          renderPosts();
        };
      });
      el.querySelectorAll('[data-comment]').forEach(b => {
        b.onclick = () => {
          const id = b.getAttribute('data-comment');
          const form = document.getElementById('commentForm-' + id);
          form.style.display = form.style.display === 'none' ? 'flex' : 'none';
        };
      });
      el.querySelectorAll('[data-comment-submit]').forEach(b => {
        b.onclick = () => {
          const id = b.getAttribute('data-comment-submit');
          const input = document.querySelector(`[data-comment-input="${id}"]`);
          const text = input.value.trim();
          if (!text) return;
          Community.comment(id, text);
          renderPosts();
        };
      });
    }

    document.getElementById('sortSelect').onchange = (e) => {
      sortMode = e.target.value;
      renderPosts();
    };

    document.getElementById('postBtn').onclick = () => {
      const text = document.getElementById('postText').value.trim();
      if (!text) { UI.toast('Post bo‘sh', 'error'); return; }
      Community.createPost({ text, communityId: activeCommunity });
      document.getElementById('postText').value = '';
      UI.toast('Post yozildi! ✓', 'success');
      renderPosts();
    };

    document.getElementById('createCommunityBtn').onclick = () => {
      UI.modal('Yangi guruh', `
        <div class="form-group mb-3">
          <label class="form-label">Nomi</label>
          <input class="input" id="cn" maxlength="50" />
        </div>
        <div class="form-group">
          <label class="form-label">Tavsif</label>
          <textarea class="textarea" id="cd2" maxlength="200"></textarea>
        </div>
      `, (overlay) => {
        const name = overlay.querySelector('#cn').value.trim();
        const desc = overlay.querySelector('#cd2').value.trim();
        if (!name) { UI.toast('Nom bo‘sh', 'error'); return; }
        Community.createCommunity({ name, description: desc });
        overlay.remove();
        UI.toast('Guruh yaratildi!', 'success');
        renderChips();
      }, t('common.create'));
    };

    renderChips();
    renderPosts();
  });
</script>
</body>
</html>
