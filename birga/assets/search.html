<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qidiruv — BIRGA</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="images/logo.svg" alt="" style="width:34px;height:34px;border-radius:10px" />
      <span>BIRGA</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html"><span class="icon">🏠</span><span data-i18n="nav.dashboard">Boshqaruv</span></a>
      <a class="nav-item" href="quiz.html"><span class="icon">🧠</span><span data-i18n="nav.quiz">Quizlar</span></a>
      <a class="nav-item" href="challenge.html"><span class="icon">🎯</span><span data-i18n="nav.challenge">Challenge</span></a>
      <a class="nav-item" href="battle.html"><span class="icon">⚔️</span><span data-i18n="nav.battle">Battle</span></a>
      <a class="nav-item" href="polls.html"><span class="icon">📊</span><span data-i18n="nav.polls">Ovoz berish</span></a>
      <a class="nav-item" href="stories.html"><span class="icon">✨</span><span data-i18n="nav.stories">Stories</span></a>
      <a class="nav-item" href="community.html"><span class="icon">👥</span><span data-i18n="nav.community">Hamjamiyat</span></a>
      <a class="nav-item" href="leaderboard.html"><span class="icon">🏆</span><span data-i18n="nav.leaderboard">Reyting</span></a>
      <a class="nav-item" href="profile.html"><span class="icon">👤</span><span data-i18n="nav.profile">Profil</span></a>
      <a class="nav-item" href="notifications.html"><span class="icon">🔔</span><span data-i18n="nav.notifications">Bildirishnomalar</span></a>
      <a class="nav-item" href="settings.html"><span class="icon">⚙️</span><span data-i18n="nav.settings">Sozlamalar</span></a>
      <a class="nav-item" href="help.html"><span class="icon">❓</span><span data-i18n="nav.help">Yordam</span></a>
    </nav>
    <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border)">
      <button class="nav-item w-full" data-logout><span class="icon">🚪</span><span data-i18n="nav.logout">Chiqish</span></button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title" data-i18n="search.title">Qidiruv</h1>
    </div>
    <input class="input mb-6" id="searchInput" style="max-width:500px;font-size:1.05rem;padding:16px 20px" data-i18n-placeholder="search.placeholder" placeholder="Foydalanuvchi, quiz yoki hamjamiyat qidiring..." />

    <div id="searchResults"></div>
  </main>
</div>

<nav class="bottom-nav">
  <ul>
    <li><a href="dashboard.html"><span class="icon">🏠</span><span data-i18n="nav.home">Bosh</span></a></li>
    <li><a href="search.html"><span class="icon">🔍</span><span data-i18n="nav.search">Qidiruv</span></a></li>
    <li><a href="community.html"><span class="icon">👥</span><span data-i18n="nav.community">Hamjamiyat</span></a></li>
    <li><a href="profile.html"><span class="icon">👤</span><span data-i18n="nav.profile">Profil</span></a></li>
    <li><a href="settings.html"><span class="icon">⚙️</span><span data-i18n="nav.settings">Sozlama</span></a></li>
  </ul>
</nav>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
<script src="js/gamification.js"></script>
<script src="js/quiz.js"></script>
<script src="js/challenge.js"></script>
<script src="js/battle.js"></script>
<script src="js/polls.js"></script>
<script src="js/stories.js"></script>
<script src="js/community.js"></script>
<script src="js/profile.js"></script>
<script src="js/sharing.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!Auth.requireAuth('login.html')) return;

    function search(q) {
      const res = document.getElementById('searchResults');
      if (!q || q.length < 1) {
        res.innerHTML = '';
        return;
      }
      const lc = q.toLowerCase();

      const users = Gamification.leaderboard().filter(u =>
        (u.name || '').toLowerCase().includes(lc) || (u.username || '').toLowerCase().includes(lc)
      ).slice(0, 5);

      const quizzes = Quiz.all().filter(x =>
        x.title.toLowerCase().includes(lc) || (x.description || '').toLowerCase().includes(lc)
      ).slice(0, 10);

      const communities = Community.allCommunities().filter(c =>
        c.name.toLowerCase().includes(lc) || (c.description || '').toLowerCase().includes(lc)
      ).slice(0, 5);

      if (!users.length && !quizzes.length && !communities.length) {
        res.innerHTML = `<div class="card text-center text-muted" style="padding:40px">${t('search.no_results')}</div>`;
        return;
      }

      res.innerHTML = `
        ${users.length ? `
          <h3 class="mb-3">${t('search.users')}</h3>
          ${users.map(u => `
            <div class="card mb-2">
              <div class="flex items-center gap-3">
                <img class="avatar avatar-sm" src="${UI.escapeHtml(u.avatar || 'images/avatars/default.svg')}" alt="" />
                <div>
                  <div style="font-weight:700">${UI.escapeHtml(u.name || u.username)}</div>
                  <div class="text-muted" style="font-size:.82rem">@${UI.escapeHtml(u.username)} · ${u.xp || 0} XP</div>
                </div>
              </div>
            </div>
          `).join('')}
        ` : ''}

        ${quizzes.length ? `
          <h3 class="mb-3 mt-6">${t('search.quizzes')}</h3>
          ${quizzes.map(x => `
            <a class="card mb-2" href="quiz-play.html?id=${encodeURIComponent(x.id)}">
              <div class="flex justify-between items-center">
                <div>
                  <div style="font-weight:700">${UI.escapeHtml(x.title)}</div>
                  <div class="text-muted" style="font-size:.82rem">${x.questions.length} ${t('quiz.questions')}</div>
                </div>
                <span class="badge badge-accent">${t('quiz.play')}</span>
              </div>
            </a>
          `).join('')}
        ` : ''}

        ${communities.length ? `
          <h3 class="mb-3 mt-6">Hamjamiyatlar</h3>
          ${communities.map(c => `
            <div class="card mb-2">
              <div style="font-weight:700">${UI.escapeHtml(c.name)}</div>
              <div class="text-muted" style="font-size:.85rem">${UI.escapeHtml(c.description || '')} · ${c.members.length} a'zo</div>
            </div>
          `).join('')}
        ` : ''}
      `;
    }

    let timer;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(timer);
      timer = setTimeout(() => search(e.target.value.trim()), 250);
    });
  });
</script>
</body>
</html>
