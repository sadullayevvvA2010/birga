    .notif-item {
      display: flex; gap: 14px; padding: 16px 20px;
      background: var(--surface); border: 1px solid var(--border);

    }
    .notif-item.unread { border-left: 4px solid var(--primary); }

      <a class="nav-item" href="quiz.html"><span class="icon">🧠</span><span data-i18n="nav.quiz">Quizlar</span></a>
      <a class="nav-item" href="challenge.html"><span class="icon">🎯</span><span data-i18n="nav.challenge">Challenge</span></a>
      <a class="nav-item" href="battle.html"><span class="icon">⚔️</span><span data-i18n="nav.battle">Battle</span></a>
      <a class="nav-item" href="polls.html"><span class="icon">📊</span><span data-i18n="nav.polls">Ovoz berish</span></a>
      <a class="nav-item" href="stories.html"><span class="icon">✨</span><span data-i18n="nav.stories">Stories</span></a>
      <a class="nav-item" href="community.html"><span class="icon">👥</span><span data-i18n="nav.community">Hamjamiyat</span></a>
      <a class="nav-item" href="leaderboard.html"><span class="icon">🏆</span><span data-i18n="nav.leaderboard">Reyting</span></a>
      <a class="nav-item" href="profile.html"><span class="icon">👤</span><span data-i18n="nav.profile">Profil</span></a>
      <a class="nav-item active" href="notifications.html"><span class="icon">🔔</span><span data-i18n="nav.notifications">Bildirishnomalar</span></a>
      <a class="nav-item" href="settings.html"><span class="icon">⚙️</span><span data-i18n="nav.settings">Sozlamalar</span></a>
      <a class="nav-item" href="help.html"><span class="icon">❓</span><span data-i18n="nav.help">Yordam</span></a>
    </nav>
    <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border)">
      <button class="nav-item w-full" data-logout><span class="icon">🚪</span><span data-i18n="nav.logout">Chiqish</span></button>

  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title" data-i18n="notif.title">Bildirishnomalar</h1>
      <button class="btn btn-secondary" id="markAllBtn">✓ <span data-i18n="notif.mark_all">Barchasini o‘qilgan deb belgilash</span></button>
    </div>
    <div id="notifList"></div>
  </main>
</div>

<nav class="bottom-nav">
  <ul>
    <li><a href="dashboard.html"><span class="icon">🏠</span><span data-i18n="nav.home">Bosh</span></a></li>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
<script src="js/gamification.js"></script>
<script src="js/quiz.js"></script>
<script src="js/challenge.js"></script>
<script src="js/battle.js"></script>
<script src="js/polls.js"></script>
<script src="js/stories.js"></script>
<script src="js/community.js"></script>
<script src="js/profile.js"></script>
<script src="js/sharing.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!Auth.requireAuth('login.html')) return;

    function render() {
      const list = Notifications.all();
      const el = document.getElementById('notifList');
      if (!list.length) {
        el.innerHTML = `<div class="card text-center" style="padding:40px">
          <p class="text-muted">${t('notif.empty')}</p>
        </div>`;
        return;
      }
      el.innerHTML = list.map(n => `
        <div class="notif-item ${!n.read ? 'unread' : ''}">
          <div class="notif-icon">${n.icon || '🔔'}</div>
          <div style="flex:1">
            <div style="font-weight:700">${UI.escapeHtml(n.title)}</div>
            <div class="text-muted" style="font-size:.88rem">${UI.escapeHtml(n.body || '')}</div>
            <div class="text-muted" style="font-size:.75rem;margin-top:4px">${UI.timeAgo(n.at)}</div>
          </div>
          ${!n.read ? `<span class="badge badge-primary">${t('notif.new')}</span>` : ''}
        </div>
      `).join('');
    }

    document.getElementById('markAllBtn').onclick = () => {
      Notifications.markAllRead();
      UI.toast('✓', 'success');
      render();
    };

    render();
  });
</script>
</body>
</html>
